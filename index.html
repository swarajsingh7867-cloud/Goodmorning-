<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Good Morning Sunshine ☀️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: linear-gradient(180deg, #ffe8df 0%, #ffd6e0 50%, #fed7aa 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      color: #3b2a26;
    }

    /* Card Wrapper */
    .app-card {
      width: 100%;
      max-width: 390px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 45px rgba(235, 120, 140, 0.18);
      padding: 24px;
      text-align: center;
      position: relative;
    }

    /* Sound Pill */
    .sound-badge {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #ea580c;
      border: 1px solid rgba(255, 255, 255, 0.9);
      cursor: pointer;
    }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.35s ease forwards;
    }
    .screen.active {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Sunrise Art */
    .art-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffedd5, #fecdd3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      margin: 20px auto 16px;
      box-shadow: 0 10px 25px rgba(251, 146, 60, 0.25);
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #831843;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Main Filled Postcard for Quotes */
    .quote-box {
      width: 100%;
      min-height: 250px;
      background: linear-gradient(145deg, #ffffff, #fff0f3);
      border-radius: 24px;
      border: 2px dashed #f472b6;
      padding: 22px 18px;
      margin: 12px 0 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 2px 8px rgba(244, 114, 182, 0.1);
    }
    .note-pill {
      background: #fdf2f8;
      color: #db2777;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .quote-text {
      font-size: 18px;
      line-height: 1.5;
      font-weight: 600;
      color: #4a1525;
      margin-bottom: 14px;
      transition: opacity 0.2s;
    }
    .quote-signature {
      font-size: 13px;
      color: #f43f5e;
      font-style: italic;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 20px;
      border-radius: 999px;
      border: none;
      box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-secondary {
      background: #ffe4e6;
      color: #e11d48;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 14px;
    }
    .chip-btn {
      background: white;
      border: 1px solid #fbcfe8;
      color: #be185d;
      font-size: 13px;
      font-weight: 700;
      padding: 10px;
      border-radius: 16px;
      cursor: pointer;
    }

    /* WhatsApp Button */
    .btn-whatsapp {
      background: #25D366;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      box-shadow: 0 8px 18px rgba(37, 211, 102, 0.3);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div id="soundToggle" class="sound-badge" onclick="toggleAudio()">🎵 Music: Tap Play</div>

    <!-- SCREEN 1: Intro -->
    <div id="screen1" class="screen active">
      <div class="art-circle">☕️</div>
      <h1>Good Morning!</h1>
      <p class="subtitle">Special wake-up delivery made just for you.</p>
      <button class="btn-primary" onclick="goToQuotes()">
        Tap to Open 💌
      </button>
    </div>

    <!-- SCREEN 2: Quotes / Full Postcard -->
    <div id="screen2" class="screen">
      <div class="quote-box">
        <div id="quoteCounter" class="note-pill">Sweet Note 1 of 5</div>
        <div id="quoteText" class="quote-text">
          "The sun was hesitating to rise today until it realized you were awake."
        </div>
        <div class="quote-signature">— your daily dose of morning sunshine ☀️</div>
      </div>

      <div class="actions-grid">
        <button class="chip-btn" onclick="sendHug()">🤗 Send Hug</button>
        <button class="chip-btn" onclick="sendCoffee()">☕️ Coffee Kiss</button>
      </div>

      <button class="btn-primary" onclick="nextQuote()">
        Next sweet note ✨
      </button>

      <button class="btn-secondary" onclick="goToScreen3()">
        Reply on WhatsApp 💬
      </button>
    </div>

    <!-- SCREEN 3: WhatsApp CTA -->
    <div id="screen3" class="screen">
      <div class="art-circle" style="font-size: 46px;">💌</div>
      <h1>Ready for the Day?</h1>
      <p class="subtitle">Let me know you woke up smiling.</p>
      
      <a id="waLink" class="btn-whatsapp" href="https://api.whatsapp.com/send?text=Good%20morning!%20Your%20cute%20little%20morning%20card%20made%20me%20smile%20%E2%98%80%EF%B8%8F" target="_blank">
        Send Reply via WhatsApp 💬
      </a>
      
      <button class="btn-secondary" style="margin-top: 14px;" onclick="goToQuotes()">
        Back to notes ↺
      </button>
    </div>
  </div>
  
  <!-- Cozy Chillhop / Acoustic Morning Lofi Track -->
  <audio id="bgSong" loop playsinline preload="auto" src="https://ia801503.us.archive.org/15/items/chill-lofi-song/chill-lofi-song.mp3"></audio>

  <script>
    const quotes = [
      "\"The sun was hesitating to rise today until it realized you were awake.\"",
      "\"Warning: Looking this cute right after waking up should be illegal.\"",
      "\"Coffee has caffeine, but seeing your name on my screen is what actually wakes me up.\"",
      "\"Here's your morning reminder: You're doing amazing, and someone's smiling thinking about you.\"",
      "\"Take on the day gently today. I'm right here cheering for you!\""
    ];
    let currentIndex = 0;
    const bgAudio = document.getElementById('bgSong');
    let isPlaying = false;

    function playAudioTrack() {
      if (!bgAudio) return;
      bgAudio.play().then(() => {
        isPlaying = true;
        document.getElementById('soundToggle').textContent = "🎵 Music: Playing";
      }).catch(err => {
        console.log("Audio unlock:", err);
      });
    }

    function toggleAudio() {
      if (!bgAudio) return;
      if (bgAudio.paused) {
        playAudioTrack();
      } else {
        bgAudio.pause();
        isPlaying = false;
        document.getElementById('soundToggle').textContent = "🎵 Music: Paused";
      }
    }

    function switchScreen(fromId, toId) {
      document.getElementById(fromId).classList.remove('active');
      document.getElementById(toId).classList.add('active');
    }

    function goToQuotes() {
      playAudioTrack();
      switchScreen('screen1', 'screen2');
    }

    function goToScreen3() {
      switchScreen('screen2', 'screen3');
    }

    function nextQuote() {
      currentIndex = (currentIndex + 1) % quotes.length;
      const quoteEl = document.getElementById('quoteText');
      quoteEl.style.opacity = '0';
      setTimeout(() => {
        quoteEl.textContent = quotes[currentIndex];
        document.getElementById('quoteCounter').textContent = `Sweet Note ${currentIndex + 1} of ${quotes.length}`;
        quoteEl.style.opacity = '1';
      }, 150);
    }

    function sendHug() {
      alert("Virtual Hug Delivered! 🤗✨");
    }

    function sendCoffee() {
      alert("Hot morning coffee sent your way! ☕️💖");
    }

    // Auto-plays on the first touch anywhere
    document.addEventListener('touchstart', function () {
      if (!isPlaying && bgAudio.paused) {
        playAudioTrack();
      }
    }, { once: true });
  </script>
</body>
</html>
